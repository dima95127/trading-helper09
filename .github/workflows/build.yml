name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and set JAVA_HOME
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-17-jdk-amd64/bin" >> $GITHUB_PATH

      - name: Install buildozer and dependencies
        run: |
          pip install buildozer==1.5.0 cython==0.29.36

      - name: Remove system Android NDK to avoid conflicts
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          echo "ANDROID_NDK=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

      - name: Build APK
        run: |
          echo y | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trading-helper-apk
          path: bin/*.apk
